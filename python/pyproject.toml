[project]
name = "gameplan-python"
version = "0.2.0"
description = "Gameplan required ingest: soccerdata + StatsBomb open-data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "soccerdata>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]
