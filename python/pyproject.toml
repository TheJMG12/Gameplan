[project]
name = "gameplan-python"
version = "0.1.0"
description = "Gameplan ingest enrichment (soccerdata, StatsBomb open-data)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
soccerdata = ["soccerdata>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]
